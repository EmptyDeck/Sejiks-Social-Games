<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liar Hunt</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { overflow: hidden; }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(oklch(26% 0.012 255 / 0.4) 1px, transparent 1px),
        linear-gradient(90deg, oklch(26% 0.012 255 / 0.4) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .bg-glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, oklch(62% 0.24 15 / 0.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 100%, oklch(76% 0.16 82 / 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .hero {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 40px 24px;
      max-width: 400px;
      margin: 0 auto;
      text-align: center;
    }

    .logo-eyebrow {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-3);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .logo-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(64px, 18vw, 96px);
      line-height: 0.9;
      letter-spacing: 0.04em;
      color: var(--text);
      margin-bottom: 6px;
    }

    .logo-accent {
      color: var(--red);
    }

    .logo-sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(28px, 8vw, 40px);
      letter-spacing: 0.1em;
      color: var(--gold);
      margin-bottom: 16px;
    }

    .logo-tagline {
      font-size: 14px;
      color: var(--text-3);
      letter-spacing: 0.02em;
      line-height: 1.6;
      margin-bottom: 48px;
    }

    .main-actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .main-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-radius: var(--r-xl);
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.2s;
      touch-action: manipulation;
    }
    .main-btn:active { transform: scale(0.97); }

    .main-btn-host {
      background: var(--gold);
      color: var(--bg);
    }
    .main-btn-host:hover { box-shadow: 0 0 32px var(--gold-glow); }

    .main-btn-join {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border-2);
    }
    .main-btn-join:hover { border-color: var(--red); box-shadow: 0 0 24px var(--red-glow); }

    .btn-label { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .btn-sub { font-size: 12px; font-weight: 500; opacity: 0.7; }
    .btn-arrow { font-size: 20px; opacity: 0.6; }

    .footer-note {
      margin-top: 40px;
      font-size: 12px;
      color: var(--text-3);
      line-height: 1.6;
    }

    .line-accent {
      width: 40px;
      height: 2px;
      background: var(--red);
      margin: 0 auto 28px;
      border-radius: 1px;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="hero">
    <p class="logo-eyebrow">Party Game</p>
    <h1 class="logo-title">LIAR<span class="logo-accent">.</span></h1>
    <p class="logo-sub">HUNT</p>
    <div class="line-accent"></div>
    <p class="logo-tagline">Offline deduction party game — no server needed<br>Find the liar, or deceive them perfectly</p>

    <div class="main-actions">
      <a href="host.html" class="main-btn main-btn-host" id="hostBtn">
        <span class="btn-label">
          <span>Create Room</span>
          <span class="btn-sub">Set players and generate invite code</span>
        </span>
        <span class="btn-arrow">→</span>
      </a>
      <a href="join.html" class="main-btn main-btn-join" id="joinBtn">
        <span class="btn-label">
          <span>Join Room</span>
          <span class="btn-sub">Enter with 4-character invite code</span>
        </span>
        <span class="btn-arrow">→</span>
      </a>
    </div>

    <p class="footer-note">No internet required · 3–17 players · Share one device</p>
  </div>

  <script>
    localStorage.clear();
  </script>
</body>
</html>
