<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liar Hunt — Host Setup</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { padding-top: 56px; }

    .page { gap: 0; }

    .page-header {
      width: 100%;
      margin-bottom: 28px;
    }
    .page-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 40px;
      letter-spacing: 0.04em;
      color: var(--text);
      margin-bottom: 4px;
    }
    .page-header p {
      font-size: 14px;
      color: var(--text-2);
    }

    .settings-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 14px 20px;
    }

    .setting-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .setting-hint {
      font-size: 12px;
      color: var(--text-3);
      margin-top: 2px;
    }

    .counter { flex-shrink: 0; }
    .counter-value { min-width: 44px; }

    .codes-section {
      width: 100%;
      margin-bottom: 20px;
    }

    .generate-btn {
      width: 100%;
      padding: 15px 20px;
      background: var(--surface);
      border: 1px dashed var(--border-2);
      border-radius: var(--r-lg);
      color: var(--text-2);
      font-size: 15px;
      font-weight: 600;
      transition: all 0.2s;
      margin-top: 12px;
    }
    .generate-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-glow);
    }

    .codes-grid {
      width: 100%;
      margin-top: 16px;
    }

    .big-invite-code {
      font-family: 'Space Mono', monospace;
      font-size: 52px;
      letter-spacing: 0.18em;
      color: var(--gold);
      text-align: center;
      padding: 28px 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      margin-bottom: 10px;
    }

    .code-info {
      text-align: center;
      font-size: 14px;
      color: var(--text-2);
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
    }

    .warning-text {
      margin-top: 10px;
      font-size: 13px;
      color: var(--red);
      text-align: center;
      padding: 10px 14px;
      background: var(--red-glow);
      border: 1px solid var(--red-dim);
      border-radius: var(--r);
    }

    .start-btn {
      width: 100%;
      padding: 18px;
      border-radius: var(--r-xl);
      font-size: 17px;
      font-weight: 700;
      background: var(--gold);
      color: var(--bg);
      transition: box-shadow 0.2s, transform 0.15s, opacity 0.15s;
      touch-action: manipulation;
    }
    .start-btn:hover { box-shadow: 0 0 32px var(--gold-glow); }
    .start-btn:active { transform: scale(0.97); }
    .start-btn.disabled {
      opacity: 0.3;
      pointer-events: none;
    }
  </style>
  <script>localStorage.clear();</script>
  <div id="hostErrorMsg" style="display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;"></div>
</head>
<body>
  <a href="index.html" class="back-btn">← Back</a>

  <div class="page">
    <div class="page-header">
      <h1>Host Setup</h1>
      <p>Set the number of players and liars</p>
    </div>

    <div class="settings-section">
      <div class="setting-row">
        <div>
          <div class="setting-label">Total Players</div>
          <div class="setting-hint">Including host · 3–17 players</div>
        </div>
        <div class="counter">
          <button class="counter-btn" onclick="changeCount('total', -1)">−</button>
          <span class="counter-value" id="totalCount">4</span>
          <button class="counter-btn" onclick="changeCount('total', 1)">+</button>
        </div>
      </div>

      <div class="setting-row">
        <div>
          <div class="setting-label">Number of Liars</div>
          <div class="setting-hint">At least 1, less than total players</div>
        </div>
        <div class="counter">
          <button class="counter-btn" onclick="changeCount('faker', -1)">−</button>
          <span class="counter-value" id="fakerCount">1</span>
          <button class="counter-btn" onclick="changeCount('faker', 1)">+</button>
        </div>
      </div>
    </div>

    <div class="codes-section">
      <p class="section-label">Invite Code</p>
      <button class="generate-btn" onclick="generateCodes()">Generate Code</button>
      <div class="codes-grid" id="codesGrid"></div>
      <p class="warning-text" id="warningText" style="display:none;">
        Settings changed. Please generate a new code.
      </p>
    </div>

    <button class="start-btn disabled" id="startBtn">Start Game</button>
  </div>

  <script src="toast.js"></script>
  <script src="gameData.js"></script>
  <script src="questions.js"></script>
  <script src="host.js"></script>
</body>
</html>
