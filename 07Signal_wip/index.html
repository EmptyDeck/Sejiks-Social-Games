  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       oklch(8%  0.025 265);
      --surf:     oklch(13% 0.030 265);
      --surf2:    oklch(18% 0.030 265);
      --accent:   oklch(82% 0.280 128);
      --accent2:  oklch(72% 0.280 345);
      --text:     oklch(96% 0.010 265);
      --muted:    oklch(55% 0.050 265);
      --border:   oklch(22% 0.040 265);
      --track:    oklch(20% 0.030 265);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root { width: 100%; height: 100%; }

    /* ── transitions ── */
    .screen-wrap {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.28s ease, transform 0.28s ease;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 0;
    }
    .screen-wrap::-webkit-scrollbar { display: none; }
    .screen-wrap.fade-out { opacity: 0; transform: translateY(12px) scale(0.98); pointer-events: none; }
    .screen-wrap.fade-in  { opacity: 1; transform: translateY(0) scale(1); }

    /* ── buttons ── */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; border: none; outline: none;
      transition: transform 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .btn:active { transform: scale(0.95); opacity: 0.85; }

    .btn-primary {
      background: var(--accent); color: var(--bg);
      padding: 18px 36px; border-radius: 14px;
      font-size: 16px;
      box-shadow: 0 0 0 0 oklch(82% 0.28 128 / 0);
    }
    .btn-primary:hover { box-shadow: 0 0 32px oklch(82% 0.28 128 / 0.35); }

    .btn-secondary {
      background: var(--surf2); color: var(--text);
      padding: 18px 36px; border-radius: 14px;
      font-size: 16px; border: 1.5px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--muted); }

    .btn-ghost {
      background: transparent; color: var(--muted);
      padding: 12px 16px; border-radius: 10px;
      font-size: 14px;
    }
    .btn-ghost:hover { color: var(--text); background: var(--surf); }

    /* ── code boxes ── */
    .code-box {
      width: 64px; height: 76px;
      background: var(--surf); border: 2px solid var(--border);
      border-radius: 14px;
      font-family: 'Space Mono', monospace;
      font-size: 28px; font-weight: 700; text-transform: uppercase;
      text-align: center; color: var(--text);
      outline: none; caret-color: var(--accent);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .code-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px oklch(82% 0.28 128 / 0.2); }

    /* ── pulsing radar bg (home screen) ── */
    @keyframes radar-ring {
      0%   { transform: translate(-50%,-50%) scale(0.4); opacity: 0.5; }
      100% { transform: translate(-50%,-50%) scale(2.8); opacity: 0; }
    }
    .radar-ring {
      position: absolute; left: 50%; top: 42%;
      border-radius: 50%;
      border: 1px solid oklch(82% 0.28 128 / 0.25);
      animation: radar-ring 4s ease-out infinite;
      pointer-events: none;
    }

    /* ── reveal overlay ── */
    @keyframes overlay-out {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(1.08); }
    }
    .overlay-out { animation: overlay-out 0.4s ease forwards; }

    /* ── count-up ── */
    @keyframes score-pop {
      0%   { transform: scale(0.7); opacity: 0; }
      60%  { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    .score-pop { animation: score-pop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }

    /* ── misc ── */
    .mono { font-family: 'Space Mono', monospace; }
    .divider { width: 100%; height: 1px; background: var(--border); }

    /* ── modal backdrop ── */
    @keyframes fade-in-back { from { opacity: 0; } to { opacity: 1; } }
    .modal-back {
      position: fixed; inset: 0;
      background: oklch(5% 0.02 265 / 0.8);
      backdrop-filter: blur(8px);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 16px; z-index: 100;
      animation: fade-in-back 0.2s ease;
    }
    @keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-sheet {
      background: var(--surf);
      border-radius: 24px; border: 1.5px solid var(--border);
      padding: 28px 24px;
      width: 100%; max-width: 400px;
      animation: sheet-up 0.25s cubic-bezier(0.34,1.3,0.64,1);
    }

    /* ── standby tap zone ── */
    @keyframes tap-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .tap-pulse { animation: tap-pulse 1.8s ease-in-out infinite; }

    /* ── progress dots ── */
    .progress-dot {
      width: 6px; height: 6px; border-radius: 50%;
      transition: background 0.3s, transform 0.3s;
    }

    /* ── gameover bar ── */
    @keyframes bar-grow { from { width: 0; } to { } }

    /* ── floating label ── */
    .pill {
      display: inline-flex; align-items: center;
      background: var(--surf2); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 12px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted);
    }

    .scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .scroll-y::-webkit-scrollbar { display: none; }

  let seed = 0;
  for (const c of code.toUpperCase()) {
    const i = ALPHA.indexOf(c);
    if (i >= 0) seed = seed * 24 + i;
  }
  return seed >>> 0;
}

function createRNG(seed) {
  let s = seed >>> 0;
  return () => {
    s = Math.imul(1664525, s) + 1013904223;
    s = s >>> 0;
    return s / 0x100000000;
  };
}

function selectQuestions(code, n = 10) {
  const rng = createRNG(codeToSeed(code));
  const pool = [...QUESTIONS];
  const out = [];
  while (out.length < n && pool.length > 0) {
    const i = Math.floor(rng() * pool.length);
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}

function calcScore(guess, answer) {
  const error = Math.abs(guess - answer);
  const denom = Math.max(answer, 5);
  const accuracy = Math.max(0, Math.min(100, 100 - (error / denom * 100)));
  return { accuracy: Math.round(accuracy * 10) / 10, roundScore: Math.round(accuracy * accuracy) };
}

function generateCode() {
  let c = '';
  for (let i = 0; i < 4; i++) c += ALPHA[Math.floor(Math.random() * ALPHA.length)];
  return c;
}

/* ─────────────────────────────────────────────────────────────
   CIRCULAR SLIDER
───────────────────────────────────────────────────────────── */
function CircularSlider({ value, onChange, size = 268 }) {
  const svgRef = React.useRef(null);
  const dragging = React.useRef(false);

  const cx = size / 2, cy = size / 2, R = size * 0.385;
  const sw = size * 0.052;

  const toXY = (deg) => {
    const r = (deg - 90) * Math.PI / 180;
    return { x: cx + R * Math.cos(r), y: cy + R * Math.sin(r) };
  };

  const pct = value / 100;
  const angle = pct * 360;
  const thumb = toXY(angle);

  const arcD = () => {
    if (value <= 0) return null;
    if (value >= 100) {
      const t = toXY(0), m = toXY(180);
      return `M${t.x},${t.y} A${R},${R} 0 0,1 ${m.x},${m.y} A${R},${R} 0 0,1 ${t.x},${t.y}`;
    }
    const s = toXY(0), e = toXY(angle);
    return `M${s.x},${s.y} A${R},${R} 0 ${value > 50 ? 1 : 0},1 ${e.x},${e.y}`;
  };

  const getVal = (clientX, clientY) => {
    const rect = svgRef.current.getBoundingClientRect();
    const dx = clientX - (rect.left + rect.width / 2);
    const dy = clientY - (rect.top + rect.height / 2);
    let deg = Math.atan2(dy, dx) * 180 / Math.PI + 90;
    if (deg < 0) deg += 360;
    return Math.min(100, Math.max(0, Math.round(deg / 360 * 100)));
  };

  const onStart = (e) => {
    e.preventDefault();
    dragging.current = true;
    const pt = e.touches ? e.touches[0] : e;
    onChange(getVal(pt.clientX, pt.clientY));
  };

  React.useEffect(() => {
    const onMove = (e) => {
      if (!dragging.current) return;
      e.preventDefault();
      const pt = e.touches ? e.touches[0] : e;
      onChange(getVal(pt.clientX, pt.clientY));
    };
    const onEnd = () => { dragging.current = false; };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onEnd);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onEnd);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onEnd);
    };
  }, []);

  // Accent glow color
  const glowOpacity = 0.15 + (value / 100) * 0.25;

  return (
    <svg
      ref={svgRef}
      width={size} height={size}
      onMouseDown={onStart}
      onTouchStart={onStart}
      style={{ touchAction: 'none', cursor: 'pointer', display: 'block', flexShrink: 0 }}
    >
      {/* Glow behind thumb */}
      <circle cx={thumb.x} cy={thumb.y} r={sw * 1.8}
        fill={`oklch(82% 0.28 128 / ${glowOpacity})`} />

      {/* Track circle */}
      <circle cx={cx} cy={cy} r={R}
        fill="none" stroke="var(--track)" strokeWidth={sw} strokeLinecap="round" />

      {/* Filled arc */}
      {arcD() && (
        <path d={arcD()} fill="none"
          stroke="var(--accent)" strokeWidth={sw} strokeLinecap="round" />
      )}

      {/* Thumb */}
      <circle cx={thumb.x} cy={thumb.y} r={sw * 0.88}
        fill="var(--bg)" stroke="var(--accent)" strokeWidth={3} />
      <circle cx={thumb.x} cy={thumb.y} r={sw * 0.42}
        fill="var(--accent)" />

      {/* Center percentage */}
      <text x={cx} y={cy - sw * 0.6}
        textAnchor="middle" dominantBaseline="middle"
        fill="var(--text)"
        fontFamily="'Space Mono', monospace"
        fontSize={size * 0.19} fontWeight="700"
      >{value}</text>
      <text x={cx} y={cy + size * 0.115}
        textAnchor="middle"
        fill="var(--muted)"
        fontFamily="'Space Grotesk', sans-serif"
        fontSize={size * 0.065} fontWeight="500"
        letterSpacing="0.12em"
      >PERCENT</text>
    </svg>
  );
}

/* ─────────────────────────────────────────────────────────────
   CODE INPUT (4 boxes)
───────────────────────────────────────────────────────────── */
function CodeInput({ value, onChange }) {
  const refs = [React.useRef(), React.useRef(), React.useRef(), React.useRef()];
  const chars = (value + '    ').slice(0, 4).split('');

  const handleKey = (i, e) => {
    const key = e.key.toUpperCase();
    if (ALPHA.includes(key)) {
      const next = chars.map((c, idx) => idx === i ? key : c).join('').trimEnd();
      onChange(next);
      if (i < 3) refs[i + 1].current?.focus();
    } else if (e.key === 'Backspace') {
      const next = chars.map((c, idx) => idx === i ? ' ' : c).join('').trimEnd();
      onChange(next);
      if (i > 0) refs[i - 1].current?.focus();
    }
    e.preventDefault();
  };

  return (
    <div style={{ display:'flex', gap:10 }}>
      {[0,1,2,3].map(i => (
        <input
          key={i}
          ref={refs[i]}
          className="code-box"
          readOnly
          value={chars[i].trim()}
          onKeyDown={(e) => handleKey(i, e)}
          onClick={() => refs[i].current?.focus()}
          inputMode="none"
        />
      ))}
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   STANDBY / REVEAL SCREEN
───────────────────────────────────────────────────────────── */
function StandbyScreen({ state, onReveal, onNext }) {
  const { questions, round, guess, revealed } = state;
  const q = questions[round];
  const { accuracy, roundScore } = calcScore(guess, q.answer);
  const [showScore, setShowScore] = React.useState(false);
  const [displayScore, setDisplayScore] = React.useState(0);
  const [overlayLeaving, setOverlayLeaving] = React.useState(false);

  const handleReveal = () => {
    if (revealed) return;
    setOverlayLeaving(true);
    setTimeout(() => {
      onReveal();
      setShowScore(true);
      // count up
      let current = 0;
      const steps = 40;
      const inc = roundScore / steps;
      const iv = setInterval(() => {
        current += inc;
        if (current >= roundScore) { setDisplayScore(roundScore); clearInterval(iv); }
        else setDisplayScore(Math.round(current));
      }, 800 / steps);
    }, 380);
  };

  const accuracyColor = accuracy >= 90 ? 'var(--accent)' : accuracy >= 70 ? 'oklch(80% 0.22 85)' : accuracy >= 50 ? 'oklch(75% 0.20 55)' : 'var(--accent2)';

  return (
    <div className="screen-wrap fade-in" style={{ justifyContent:'flex-start', padding:'0' }}>
    <div style={{ width:'100%', maxWidth:480, padding:'24px 24px', display:'flex', flexDirection:'column', alignItems:'center' }}>

      {/* Top */}
      <div style={{ textAlign:'center', marginBottom:32 }}>
        <div className="pill" style={{ marginBottom:12 }}>Round {round + 1} of 10</div>
        <p style={{ fontSize:13, color:'var(--muted)', lineHeight:1.5, textWrap:'pretty' }}>{q.text}</p>
      </div>

      {/* Reveal area */}
      <div style={{
        position:'relative',
        background:'var(--surf)', border:'1.5px solid var(--border)',
        borderRadius:24, padding:'32px 24px', marginBottom:24,
        overflow:'hidden', cursor: revealed ? 'default' : 'pointer',
        textAlign:'center'
      }} onClick={!revealed ? handleReveal : undefined}>

        {/* Answer + guess (always rendered, overlaid when not revealed) */}
        <div>
          <p style={{ fontSize:12, color:'var(--muted)', letterSpacing:'0.12em', textTransform:'uppercase', marginBottom:8 }}>The Answer</p>
          <p style={{
            fontFamily:"'Space Mono', monospace",
            fontSize:68, fontWeight:700, lineHeight:1,
            color:'var(--accent)', marginBottom:4
          }}>{q.answer}<span style={{ fontSize:36 }}>%</span></p>

          <div className="divider" style={{ margin:'20px 0' }} />

          <div style={{ display:'flex', justifyContent:'space-around' }}>
            <div>
              <p style={{ fontSize:11, color:'var(--muted)', letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:4 }}>Your Guess</p>
              <p style={{ fontFamily:"'Space Mono', monospace", fontSize:28, fontWeight:700 }}>{guess}%</p>
            </div>
            <div>
              <p style={{ fontSize:11, color:'var(--muted)', letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:4 }}>Accuracy</p>
              <p style={{ fontFamily:"'Space Mono', monospace", fontSize:28, fontWeight:700, color: accuracyColor }}>{accuracy}%</p>
            </div>
          </div>
        </div>

        {/* Overlay */}
        {!revealed && !overlayLeaving && (
          <div style={{
            position:'absolute', inset:0,
            background:'var(--surf)',
            borderRadius:24,
            display:'flex', flexDirection:'column',
            alignItems:'center', justifyContent:'center',
            gap:12,
          }}>
            <div style={{ fontSize:32 }}>🔒</div>
            <p style={{
              fontFamily:"'Space Grotesk', sans-serif",
              fontSize:16, fontWeight:700,
              letterSpacing:'0.12em', textTransform:'uppercase',
              color:'var(--muted)'
            }}>Your answer is locked in</p>
            <div className="tap-pulse" style={{ marginTop:8 }}>
              <div style={{
                background:'var(--surf2)', border:'1.5px solid var(--border)',
                borderRadius:999, padding:'12px 24px',
                fontSize:14, fontWeight:600, letterSpacing:'0.08em',
                color:'var(--text)'
              }}>Tap to Reveal</div>
            </div>
            <p style={{ fontSize:12, color:'var(--border)', marginTop:4 }}>
              Wait for everyone to submit first
            </p>
          </div>
        )}
        {overlayLeaving && (
          <div className="overlay-out" style={{
            position:'absolute', inset:0,
            background:'var(--surf)', borderRadius:24,
            display:'flex', alignItems:'center', justifyContent:'center',
          }}>
            <div style={{ fontSize:32 }}>🔒</div>
          </div>
        )}
      </div>

      {/* Score */}
      {revealed && (
        <div className="score-pop" style={{
          background: 'oklch(82% 0.28 128 / 0.08)',
          border:'1.5px solid oklch(82% 0.28 128 / 0.3)',
          borderRadius:16, padding:'20px 24px',
          textAlign:'center', marginBottom:24,
        }}>
          <p style={{ fontSize:11, color:'oklch(82% 0.28 128)', letterSpacing:'0.15em', textTransform:'uppercase', marginBottom:4 }}>Round Score</p>
          <p style={{
            fontFamily:"'Space Mono', monospace",
            fontSize:42, fontWeight:700, color:'var(--accent)',
          }}>+{displayScore.toLocaleString()}</p>
        </div>
      )}

      {revealed && (

          onClick={onNext}>

    </div>

  );

        <p style={{
          fontFamily:"'Space Mono', monospace",
          fontSize:'clamp(48px,14vw,72px)', fontWeight:700,
          color:'var(--text)', lineHeight:1, marginBottom:4
        }}>{total.toLocaleString()}</p>
        <p style={{ fontSize:13, color:'var(--muted)' }}>out of {maxPossible.toLocaleString()} possible</p>
      </div>

      {/* Round breakdown */}
      <div style={{ width:'100%', marginBottom:20 }}>
        <p style={{ fontSize:11, color:'var(--muted)', letterSpacing:'0.12em', textTransform:'uppercase', marginBottom:12 }}>Round Breakdown</p>
        <div style={{ display:'flex', flexDirection:'column', gap:8, width:'100%' }}>
          {scoreData.map((s, i) => (
            <div key={i} style={{
              background:'var(--surf)', border:'1.5px solid var(--border)',
              borderRadius:12, padding:'12px 16px',
            }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
                <span style={{ fontSize:12, color:'var(--muted)' }}>Round {i + 1}</span>
                <span style={{
                  fontFamily:"'Space Mono', monospace",
                  fontSize:13, fontWeight:700,
                  color: s.accuracy >= 80 ? 'var(--accent)' : 'var(--text)'
                }}>+{s.roundScore.toLocaleString()}</span>
              </div>
              <div style={{ display:'flex', justifyContent:'space-between', fontSize:11, color:'var(--border)', marginBottom:8 }}>
                <span>Guess: <span style={{ color:'var(--text)', fontFamily:"'Space Mono',monospace" }}>{guesses[i]}%</span></span>
                <span>Answer: <span style={{ color:'var(--accent)', fontFamily:"'Space Mono',monospace" }}>{questions[i].answer}%</span></span>
                <span>Acc: <span style={{ color:'var(--text)', fontFamily:"'Space Mono',monospace" }}>{s.accuracy}%</span></span>
              </div>
              {/* Bar */}
              <div style={{ height:3, background:'var(--border)', borderRadius:99, overflow:'hidden' }}>
                <div className="score-bar-fill" style={{
                  height:'100%', borderRadius:99,
                  background:'var(--accent)',
                  width:`${(s.roundScore / 10000) * 100}%`
                }} />
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display:'flex', flexDirection:'column', gap:10, width:'100%', flexShrink:0 }}>
        <button className="btn btn-primary" style={{ width:'100%', fontSize:16, padding:'18px' }}
          onClick={onReplay}>Play Again (same code)</button>
        <button className="btn btn-secondary" style={{ width:'100%', fontSize:16, padding:'18px' }}
          onClick={onHome}>Main Menu</button>
      </div>
    </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   APP
───────────────────────────────────────────────────────────── */
const INIT = {
  screen: 'home',
  gameCode: '',
  questions: [],
  round: 0,
  pendingGuess: 50,
  guess: 50,
  guesses: [],
  revealed: false,
};

function App() {
  const [state, setState] = React.useState(() => {
    try {
      const s = JSON.parse(localStorage.getItem('signal_v1') || 'null');
      return s || INIT;
    } catch { return INIT; }
  });
  const [fading, setFading] = React.useState(false);

  const save = (next) => {
    setState(next);
    try { localStorage.setItem('signal_v1', JSON.stringify(next)); } catch {}
  };

  const go = (updates) => {
    setFading(true);
    setTimeout(() => {
      save({ ...state, ...updates });
      setFading(false);
    }, 250);
  };

  // Quit event from modal inside play screen
  React.useEffect(() => {
    const handler = () => go({ screen: 'home', ...INIT });
    window.addEventListener('signal-quit', handler);
    return () => window.removeEventListener('signal-quit', handler);
  }, [state]);

  const startGame = (code) => {
    const questions = selectQuestions(code);
    go({ screen: 'play', gameCode: code, questions, round: 0, pendingGuess: 50, guesses: [], revealed: false });
  };

  const submitGuess = (guess) => {
    go({ screen: 'standby', guess, revealed: false });
  };

  const revealAnswer = () => {
    save({ ...state, revealed: true });
  };

  const nextRound = () => {
    const newGuesses = [...state.guesses, state.guess];
    if (state.round >= 9) {
      go({ screen: 'gameover', guesses: newGuesses });
    } else {
      go({ screen: 'play', round: state.round + 1, pendingGuess: 50, guesses: newGuesses, revealed: false });
    }
  };

  const setGuess = (v) => {
    save({ ...state, pendingGuess: v });
  };

  const { screen } = state;

  return (
    <div style={{ width:'100%', height:'100%', position:'relative' }}>
      <div className={`screen-wrap ${fading ? 'fade-out' : 'fade-in'}`}>
        {screen === 'home' && (
          <HomeScreen go={(s) => go({ screen: s })} />
        )}
        {screen === 'host' && (
          <HostScreen
            goBack={() => go({ screen: 'home' })}
            startGame={startGame}
          />
        )}
        {screen === 'join' && (
          <JoinScreen
            goBack={() => go({ screen: 'home' })}
            startGame={startGame}
          />
        )}
        {screen === 'play' && (
          <PlayScreen state={state} setGuess={setGuess} onSubmit={submitGuess} />
        )}
        {screen === 'standby' && (
          <StandbyScreen state={state} onReveal={revealAnswer} onNext={nextRound} />
        )}
        {screen === 'gameover' && (
          <GameOverScreen
            state={state}
            onReplay={() => startGame(state.gameCode)}
            onHome={() => go({ screen: 'home', ...INIT })}
          />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
