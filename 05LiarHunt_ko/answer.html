<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>라이어 헌트 — 답변 공개</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Header ── */
    .game-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .game-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 0.08em;
      color: var(--text);
    }
    .game-status { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .status-text { font-size: 13px; color: var(--text-2); font-weight: 500; }
    .player-text { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--gold); letter-spacing: 0.08em; }

    /* ── Answer card ── */
    .answer-section {}
    .card-container { position: relative; }

    .answer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 28px 20px 24px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
      user-select: none;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .answer-card:hover { border-color: var(--border-2); }
    .answer-card:active { transform: scale(0.99); }

    .card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 0.06em;
      color: var(--text-2);
    }

    .tap-indicator {}
    .tap-animation {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      margin: 0 auto 6px;
      animation: tap-ring 1.8s ease-in-out infinite;
    }
    @keyframes tap-ring {
      0%   { transform: scale(0.8); opacity: 0.8; }
      50%  { transform: scale(1.1); opacity: 0.4; }
      100% { transform: scale(0.8); opacity: 0.8; }
    }
    .tap-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 0.12em;
      color: var(--gold);
    }

    .answer-content {
      display: none;
      width: 100%;
    }
    .answer-content.show { display: block; }
    .answer-content .answer-text {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      text-wrap: pretty;
    }
    .answer-content canvas {
      max-width: 100%;
      border-radius: var(--r);
      background: #fff;
    }

    /* ── Voting section ── */
    .voting-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 20px 16px;
    }

    .section-header {
      margin-bottom: 16px;
    }
    .section-icon { font-size: 20px; margin-bottom: 4px; display: block; }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 0.04em;
      color: var(--text);
      margin-bottom: 3px;
    }
    .section-subtitle { font-size: 13px; color: var(--text-3); }

    .vote-counter {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      margin-bottom: 14px;
    }
    .counter-text { font-size: 14px; color: var(--text-2); font-weight: 600; flex: 1; }
    .counter-progress { flex: 2; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--red); border-radius: 2px; transition: width 0.3s; width: 0%; }

    /* vote buttons — generated by answer.js */
    .vote-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }

    /* answer.js creates: button.vote-btn + .voted class */
    .vote-btn {
      padding: 12px 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text-2);
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s;
      touch-action: manipulation;
    }
    .vote-btn:hover { border-color: var(--red-dim); color: var(--text); background: var(--surface-3); }
    .vote-btn:active { transform: scale(0.96); }
    .vote-btn.voted {
      background: var(--red-glow);
      border-color: var(--red);
      color: var(--red);
    }

    /* ── Action panel ── */
    .action-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .action-row { display: flex; gap: 10px; }

    .action-btn {
      flex: 1;
      padding: 14px 12px;
      border-radius: var(--r-lg);
      font-size: 14px;
      font-weight: 700;
      transition: transform 0.15s, box-shadow 0.2s;
      touch-action: manipulation;
    }
    .action-btn:active { transform: scale(0.97); }
    .full-width { width: 100%; }

    .btn-surrender { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
    .btn-end       { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
    .btn-next      { background: var(--gold); color: var(--bg); }
    .btn-next:hover { box-shadow: 0 0 24px var(--gold-glow); }
    .btn-continue  { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn-back      { background: var(--surface); color: var(--text-2); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="game-header">
      <div class="game-logo">
        <span class="logo-title">LIAR HUNT</span>
      </div>
      <div class="game-status">
        <span class="status-text" id="gameInfo">게임 1 - 라운드 1</span>
        <span class="player-text" id="playerRole">호스트</span>
      </div>
    </div>

    <!-- Answer card -->
    <div class="answer-section">
      <div class="card-container">
        <div class="answer-card" id="answerCard">
          <div class="card-title" id="cardTitle">터치하여 답변 공개</div>
          <div class="tap-indicator">
            <div class="tap-animation"></div>
            <span class="tap-text">TAP</span>
          </div>
          <div class="answer-content" id="answerContent">
            <div class="answer-text">여기에 답변이 표시됩니다</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Voting -->
    <div class="voting-section">
      <div class="section-header">
        <span class="section-icon">🕵️</span>
        <div class="section-title">라이어를 찾아라</div>
        <div class="section-subtitle">의심되는 플레이어에게 투표하세요</div>
      </div>

      <div class="vote-counter">
        <span class="counter-icon">🗳️</span>
        <span class="counter-text" id="voteCount">투표: 0명</span>
        <div class="counter-progress">
          <div class="progress-bar" id="voteProgress"></div>
        </div>
      </div>

      <div class="vote-grid" id="voteSection"></div>
    </div>

    <!-- Actions -->
    <div class="action-panel">
      <div class="action-row">
        <button class="action-btn btn-back" id="backBtn">이전 페이지</button>
        <button class="action-btn btn-next" id="nextRoundBtn">다음 라운드</button>
      </div>
      <div class="action-row">
        <button class="action-btn btn-surrender" id="giveUpBtn">라이어 포기</button>
        <button class="action-btn btn-end" id="endGameBtn">게임 종료</button>
      </div>
      <button class="action-btn btn-continue full-width" id="nextGameBtn">다음 게임</button>
    </div>
  </div>

  <!-- Modals -->
  <div class="modal-overlay" id="giveUpModal">
    <div class="modal-content">
      <h3 class="modal-title">라이어 포기</h3>
      <p class="modal-message">라이어로서 포기하시겠습니까?<br><strong style="color:var(--red);">이 선택은 되돌릴 수 없습니다</strong></p>
      <div class="modal-buttons">
        <button class="modal-btn confirm-btn" onclick="confirmGiveUp()">포기</button>
        <button class="modal-btn cancel-btn" onclick="closeModal('giveUpModal')">취소</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="endGameModal">
    <div class="modal-content">
      <h3 class="modal-title">게임 종료</h3>
      <p class="modal-message">게임을 종료하시겠습니까?</p>
      <div class="modal-buttons">
        <button class="modal-btn confirm-btn" onclick="confirmEndGame()">종료</button>
        <button class="modal-btn cancel-btn" onclick="closeModal('endGameModal')">취소</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="nextRoundModal">
    <div class="modal-content">
      <h3 class="modal-title">다음 라운드</h3>
      <p class="modal-message">다음 라운드로 진행하시겠습니까?</p>
      <div class="modal-buttons">
        <button class="modal-btn confirm-btn" onclick="confirmNextRound()">진행</button>
        <button class="modal-btn cancel-btn" onclick="closeModal('nextRoundModal')">취소</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="nextGameModal">
    <div class="modal-content">
      <h3 class="modal-title">다음 게임</h3>
      <p class="modal-message">다음 게임으로 진행하시겠습니까?</p>
      <div class="modal-buttons">
        <button class="modal-btn confirm-btn" onclick="confirmNextGame()">진행</button>
        <button class="modal-btn cancel-btn" onclick="closeModal('nextGameModal')">취소</button>
      </div>
    </div>
  </div>

  <script src="toast.js"></script>
  <script src="gameData.js"></script>
  <script src="questions.js"></script>
  <script src="answer.js"></script>
</body>
</html>
